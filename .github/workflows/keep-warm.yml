# Render's free tier spins a service down after ~15 minutes of inactivity, and
# the next request then pays a cold start of roughly a minute while the
# container is rebuilt and the model is refitted.
#
# That is fine for casual use and bad for a live demo: a judge opening the link
# cold sees a blank tab for a minute and assumes it is broken. This workflow
# pings the health endpoint often enough to keep the instance awake.
#
# It is scheduled, not always-on, so it does not burn the free tier's monthly
# hours outside the window it is needed. Adjust or disable from the Actions tab.

name: Keep demo warm

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs under load, which is
    # tolerable here — a missed ping costs one cold start, not correctness.
    - cron: "*/10 * * * *"
  workflow_dispatch:        # lets you warm it on demand, right before a demo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the service
        run: |
          URL="https://pathfinder1-vov3.onrender.com/api/health"
          # A cold start can take ~60s, so allow generously before failing.
          code=$(curl -s -o /tmp/body -m 120 -w "%{http_code}" "$URL" || echo 000)
          echo "HTTP $code"
          cat /tmp/body || true
          test "$code" = "200"
