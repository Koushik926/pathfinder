services:
  - type: web
    name: pathfinder
    runtime: python
    plan: free
    buildCommand: |
      cd frontend && npm ci && npm run build
      cd ../backend && pip install -e .
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "20"
      # Optional — leave unset to run in offline mode.
      - key: ANTHROPIC_API_KEY
        sync: false
