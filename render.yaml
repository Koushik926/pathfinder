services:
  - type: web
    name: pathfinder
    # Docker rather than the Python runtime: the build needs Node to compile
    # the frontend, and the Dockerfile pins both toolchains explicitly instead
    # of depending on what happens to be present in a language image.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Render injects PORT; the container reads it.
      - key: PORT
        value: "8000"
      # Optional — leave unset to run in offline mode.
      - key: ANTHROPIC_API_KEY
        sync: false
